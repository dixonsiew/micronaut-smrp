---
apiVersion: v1
kind: Service
metadata:
  name: smrp-service
spec:
  type: NodePort
  selector:
    app: smrp-micronaut
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8300
      nodePort: 30083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrp-micronaut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrp-micronaut
  template:
    metadata:
      labels:
        app: smrp-micronaut
    spec:
      containers:
        - name: smrp-micronaut
          image: docker.io/wfsiew888/smrp-micronaut:1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8300
              name: http
              protocol: TCP
