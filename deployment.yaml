apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrp-micronaut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrp-micronaut
  template:
    metadata:
      labels:
        app: smrp-micronaut
    spec:
      containers:
        - name: smrp-micronaut
          image: docker.io/wfsiew888/smrp-micronaut:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: smrp-service
spec:
  selector:
    app: smrp-micronaut
  ports:
    - name: http
      nodePort: 30081
      protocol: TCP
      port: 8200
      targetPort: 8200
  type: NodePort