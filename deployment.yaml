---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smrp-mn-db-config
data:
  DB_HOST: "postgres-service"
  MONGODB_HOST: "mongodb-service"
  REDIS_HOST: "redis-service"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.default.svc.cluster.local:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: smrp-mn
spec:
  type: NodePort
  selector:
    app: smrp-mn
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8200
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrp-mn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrp-mn
  template:
    metadata:
      labels:
        app: smrp-mn
    spec:
      containers:
        - name: smrp-mn
          image: docker.io/wfsiew888/smrp-mn:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: smrp-mn-db-config
                optional: true
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smrp-mn-db-config
                  key: DB_HOST
                  optional: true
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smrp-mn-db-config
                  key: MONGODB_HOST
                  optional: true
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smrp-mn-db-config
                  key: REDIS_HOST
                  optional: true
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: smrp-mn-db-config
                  key: KAFKA_BOOTSTRAP_SERVERS
                  optional: true
