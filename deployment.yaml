apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrp
  template:
    metadata:
      labels:
        app: smrp
    spec:
      containers:
        - name: smrp
          image: smrp:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8300
---
apiVersion: v1
kind: Service
metadata:
  name: smrp-service
spec:
  type: NodePort
  selector:
    app: smrp
  ports:
    - port: 8300
      targetPort: 8300
      nodePort: 30081