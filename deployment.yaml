---
apiVersion: v1
kind: Service
metadata:
  name: smrp-mn
spec:
  type: NodePort
  selector:
    app: smrp-mn
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8200
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrp-mn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrp-mn
  template:
    metadata:
      labels:
        app: smrp-mn
    spec:
      containers:
        - name: smrp-mn
          image: docker.io/wfsiew888/smrp-mn:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
