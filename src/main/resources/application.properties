#Wed Oct 21 12:22:30 UTC 2026
micronaut.application.name=smrp
micronaut.openapi.views.spec=swagger-ui.enabled=true,swagger-ui.theme=flattop
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

micronaut.security.enabled=true
micronaut.security.filter.enabled=true
micronaut.security.intercept-url-map[0].pattern=/swagger/**
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[1].access=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/public/**
micronaut.security.intercept-url-map[2].access=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=/soap/**
micronaut.security.intercept-url-map[3].access=isAnonymous()
micronaut.security.intercept-url-map[4].pattern=/redis/**
micronaut.security.intercept-url-map[4].access=isAnonymous()

micronaut.server.context-path=/smrp
micronaut.server.port=8200
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.default.allowed-origins=*
micronaut.server.cors.configurations.default.exposed-headers=Authorization,filename,x-total-count,x-total-page

micronaut.serde.jackson.pretty-print=true

r2dbc.datasources.default.dialect=POSTGRES
r2dbc.datasources.default.url=r2dbc:pool:postgresql://postgres-service:5432/smrpdb_uat
r2dbc.datasources.default.username=postgres
r2dbc.datasources.default.password=postgres
r2dbc.datasources.default.options.initialSize=10
r2dbc.datasources.default.options.maxSize=50
r2dbc.datasources.default.options.maxIdleTime=PT30M

micronaut.router.static-resources.default.enabled=true
micronaut.router.static-resources.default.mapping=/public/**
micronaut.router.static-resources.default.paths=classpath:public

mongodb.uri=mongodb://mongodb-service:27017
mongodb.prefix=default
facilityCode=13-07010010

redis.uri=redis://redis-service:6379
redis.pool.enabled=true
redis.pool.max-total=16
redis.pool.min-idle=4
