apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres-container
        image: postgres:18 # Use the exact name/tag you loaded
        imagePullPolicy: Never         # Tells Minikube to look locally
        ports:
        - containerPort: 5432          # The port your app listens on